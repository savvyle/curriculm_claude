<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Curriculum Maker</title>
    <link rel="stylesheet" href="/style.css" />
  </head>
  <body>
    <div class="container">
      <a href="/" class="back-link">Back</a>
      <h1>Curriculum Maker</h1>
      <textarea id="editor" placeholder="Write your curriculum here..."></textarea>
      <button id="saveBtn" style="margin-top: 12px; margin-left: 0">Save</button>
      <div id="status" class="status" style="display: none"></div>
    </div>
    <script src="/shared.js"></script>
    <script>
      const editor = document.getElementById("editor");
      const status = document.getElementById("status");

      api("GET", "/api/curriculum").then((data) => (editor.value = data.content));

      document.getElementById("saveBtn").addEventListener("click", async () => {
        await api("POST", "/api/curriculum", { content: editor.value });
        status.textContent = "Saved successfully.";
        status.className = "status success";
        status.style.display = "block";
        setTimeout(() => (status.style.display = "none"), 2000);
      });
    </script>
  </body>
</html>
