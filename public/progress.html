<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>My Progress</title>
    <link rel="stylesheet" href="/style.css" />
  </head>
  <body>
    <div class="container">
      <a href="/" class="back-link">Back</a>
      <h1>My Progress</h1>
      <div id="info">Loading...</div>
      <table id="table" style="display: none">
        <thead><tr><th>Name</th><th>Status</th></tr></thead>
        <tbody id="tbody"></tbody>
      </table>
    </div>
    <script src="/shared.js"></script>
    <script>
      (async () => {
        const name = getUser();
        if (!name) {
          document.getElementById("info").textContent = "Please sign in first.";
          return;
        }

        const data = await api("GET", `/api/progress/user?name=${encodeURIComponent(name)}`);
        document.getElementById("info").style.display = "none";
        document.getElementById("table").style.display = "table";

        const viewed = data.viewed;
        document.getElementById("tbody").innerHTML =
          `<tr><td>${data.name}</td><td><span class="badge ${viewed ? "yes" : "no"}">${viewed ? "Viewed" : "Not viewed"}</span></td></tr>`;
      })();
    </script>
  </body>
</html>
