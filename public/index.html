<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>CurricuLM</title>
    <link rel="stylesheet" href="/style.css" />
  </head>
  <body>
    <div class="container">
      <h1>CurricuLM</h1>
      <div class="form-row">
        <input type="text" id="nameInput" placeholder="Enter your name" />
        <button id="submitBtn">Sign In</button>
      </div>
      <div id="links" class="links" style="display: none"></div>
    </div>

    <script src="/shared.js"></script>

    <script>
      const nameInput = document.getElementById("nameInput");
      const linksDiv = document.getElementById("links");

      document.getElementById("submitBtn").addEventListener("click", signin);
      nameInput.addEventListener("keydown", (e) => {
        if (e.key === "Enter") signin();
      });

      async function signin() {
        const name = nameInput.value.toLowerCase().trim();
        if (!name) return;
        const data = await api("POST", "/api/signin", { name });
        sessionStorage.setItem("userName", data.name);
        sessionStorage.setItem("isAdmin", data.isAdmin);
        showLinks(data.isAdmin);
      }

      function showLinks(isAdmin) {
        const pages = isAdmin
          ? [
              ["Curriculum Maker", "/maker.html"],
              ["Curriculum", "/viewer.html"],
              ["Tracker", "/tracker.html"],
              ["My Progress", "/progress.html"],
            ]
          : [
              ["Curriculum", "/viewer.html"],
              ["Progress", "/progress.html"],
            ];

        linksDiv.innerHTML = pages
          .map(([label, href]) => `<a href="${href}">${label}</a>`)
          .join("");
        linksDiv.style.display = "block";
      }

      const savedName = getUser();
      if (savedName) {
        nameInput.value = savedName;
        showLinks(sessionStorage.getItem("isAdmin") === "true");
      }
    </script>
  </body>
</html>
