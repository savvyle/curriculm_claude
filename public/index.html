<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Curriculum - Sign In</title>
    <link rel="stylesheet" href="/style.css" />
  </head>
  <body>
    <div class="container">
      <h1>Curriculum App</h1>
      <div class="form-row">
        <input type="text" id="nameInput" placeholder="Enter your name" />
        <button id="submitBtn">Submit</button>
      </div>
      <div id="links" class="links" style="display: none"></div>
    </div>
    <script>
      const nameInput = document.getElementById("nameInput");
      const submitBtn = document.getElementById("submitBtn");
      const linksDiv = document.getElementById("links");

      submitBtn.addEventListener("click", signin);
      nameInput.addEventListener("keydown", (e) => {
        if (e.key === "Enter") signin();
      });

      async function signin() {
        const name = nameInput.value.trim();
        if (!name) return;

        const res = await fetch("/api/signin", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ name }),
        });
        const data = await res.json();

        sessionStorage.setItem("userName", data.name);
        sessionStorage.setItem("isAdmin", data.isAdmin);

        showLinks(data.isAdmin);
      }

      function showLinks(isAdmin) {
        let html = "";
        if (isAdmin) {
          html += `<a href="/maker.html">Curriculum Maker</a>`;
          html += `<a href="/curriculum.html">Curriculum</a>`;
          html += `<a href="/tracker.html">Tracker</a>`;
          html += `<a href="/progress.html">My Progress</a>`;
        } else {
          html += `<a href="/curriculum.html">Curriculum</a>`;
          html += `<a href="/progress.html">Progress</a>`;
        }
        linksDiv.innerHTML = html;
        linksDiv.style.display = "block";
      }

      // Restore session on page load (for "Back" navigation)
      const savedName = sessionStorage.getItem("userName");
      const savedAdmin = sessionStorage.getItem("isAdmin");
      if (savedName) {
        nameInput.value = savedName;
        showLinks(savedAdmin === "true");
      }
    </script>
  </body>
</html>
